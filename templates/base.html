{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "css/base.css" %}">
    <title>{% block title %}ModeloApp{% endblock title %}</title>
</head>
<body class="core_body">
    {% if user.is_authenticated %}

    <br />
    Voce está logado como: {{ user.get_full_name|default:user.username }}
    <br />
    <a href="{% url "accounts:user_change_information" user.username %}"><button>Conta</button></a>
    <a href="{% url "accounts:user_change_password" %}"><button>Trocar senha</button></a>
    <a href="{% url "accounts:user_logout" %}"><button>Sair</button></a>
    <br />
    <br />

    <a href="{% url "core:home" %}"><img src="{% static "img/menu.png" %}" width="200" height="60"/></a>
    <br />

    <br />
    <form action="{% url "clients:search_clients" %}" method="GET">
        <input name="query" type="text" placeholder="Sobrenome do Cliente" aria-label="Buscar">
        <button type="submit">Buscar</button>
    </form>

    <br />
    <a href="{% url "categories:list_categories" %}" ><button onclick="mudarCor()">Categorias</button></a>
    <a href="{% url "products:list_products" %}" ><button>Produtos</button></a>
    <a href="{% url "socialnetworks:list_socialnetworks" %}" ><button>Rede Sociais</button></a>
    <a href="{% url "employees:list_employees" %}" ><button>Funcionários</button></a>
    <a href="{% url "clients:list_clients" %}" ><button>Clientes</button></a>
    <a href="{% url "orders:list_orders" %}" ><button>Pedidos</button></a>
    <a href="{% url "orders:list_items_products" %}" ><button>Compras</button></a>
    <br />

    {% endif %}
    {% block body %}

    {% endblock body %}

    <script src="{% static "js/base.js" %}"></script>
</body>
</html>
